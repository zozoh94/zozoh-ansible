services:
  proxy:
    image: traefik:v2.4
    container_name: traefik
    dns:
    - 1.1.1.1
    - 1.0.0.1
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls.certresolver=letsencrypt
    - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    - --certificatesresolvers.letsencrypt.acme.email=enzo@zozoh.fr
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./letsencrypt:/letsencrypt
    - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
  vpn:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    environment:
    - VPN_SERVICE_PROVIDER=private internet access
    - VPN_TYPE=openvpn
    - OPENVPN_USER=p6690039
    - OPENVPN_PASSWORD=piaPanda94!
    - SERVER_REGIONS=Netherlands
    - VPN_PORT_FORWARDING=on
    - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    - BLOCK_MALICIOUS=off
    - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'n=0; until wget -q -O /dev/null --post-data="json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences; do n=$$((n+1)); [ $$n -ge 12 ] && break; sleep 5; done'
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    restart: always
  vpn2:
    image: qmcgaw/gluetun
    container_name: gluetun2
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    environment:
    - VPN_SERVICE_PROVIDER=private internet access
    - VPN_TYPE=openvpn
    - OPENVPN_USER=p6690039
    - OPENVPN_PASSWORD=piaPanda94!
    - SERVER_REGIONS=Netherlands
    - VPN_PORT_FORWARDING=on
    - FIREWALL_OUTBOUND_SUBNETS=192.168.3.0/24
    - BLOCK_MALICIOUS=off
    - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'n=0; until wget -q -O /dev/null --post-data="json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8081/api/v2/app/setPreferences; do n=$$((n+1)); [ $$n -ge 12 ] && break; sleep 5; done'
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    restart: always
  torrent:
    image: ghcr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: service:vpn
    depends_on:
    - vpn
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Paris
    labels:
    - traefik.enable=true
    - traefik.http.services.torrent.loadbalancer.server.port=8080
    - traefik.http.routers.torrent.rule=Host(`torrent.zozoh.fr`)
    volumes:
    - ./torrent/config:/config
    - /mnt/ssd/Downloads:/downloads
    - /mnt/ssd/music:/downloads/musics
    - /mnt/ssd/videos/Films:/downloads/movies
    - /mnt/ssd/videos/Séries:/downloads/series
    - /mnt/DATA/Musique:/downloads/musics-archive
    - /mnt/DATA/Videos/Films:/downloads/movies-archive
    - /mnt/DATA/Videos/Séries:/downloads/series-archive
    - /mnt/DATA/Livres:/downloads/books
    - /mnt/DATA/Downloads:/downloads-old
    restart: always
  qbit-maintenance:
    image: python:3-alpine
    container_name: qbit-maintenance
    network_mode: service:vpn
    depends_on:
    - vpn
    - torrent
    environment:
    - TZ=Europe/Paris
    - DRY_RUN=true
    - RUN_AT_HOUR=5
    volumes:
    - /mnt/ssd/Downloads:/downloads:ro
    - /opt/torrent/maintenance:/app
    - /etc/localtime:/etc/localtime:ro
    command:
    - python
    - /app/qbit_maintenance.py
    restart: always
  torrent2:
    image: ghcr.io/linuxserver/qbittorrent
    container_name: qbittorrent2
    network_mode: service:vpn2
    depends_on:
    - vpn2
    environment:
    - WEBUI_PORT=8081
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Paris
    labels:
    - traefik.enable=true
    - traefik.http.services.torrent2.loadbalancer.server.port=8081
    - traefik.http.routers.torrent2.rule=Host(`torrent31.zozoh.fr`)
    volumes:
    - ./torrent2/config:/config
    - /mnt/ssd/.31zoz94:/downloads
    restart: always
  radarr:
