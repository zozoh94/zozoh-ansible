---
- hosts: gitlab_runner
  become: yes
  vars:
    sshd_listen: "{{ ansible_all_ipv4_addresses | ansible.netcommon.ipaddr(admin_network) | first }}"
    
    gitlab_runner_runners:
      - name: '{{ ansible_hostname }}'
        state: present
        executor: 'shell'
        output_limit: 4096
        concurrent_specific: '0'
        url: "{{ gitlab_runner_url }}"
        token: "{{ gitlab_runner_token }}"
  
  roles:
    - common
    - riemers.gitlab-runner

  # Docker 29.7+ enables the containerd image store by default. Its push path
  # skips layers the registry reports as "already exists" without linking them
  # to the repository, so the manifest PUT fails with "blob unknown to registry"
  # (moby/moby#53293). The shell executor builds and pushes through this host's
  # Docker, so pin it back to the classic (overlay2) image store.
  tasks:
    - name: Disable Docker containerd image store (classic push path)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "features": {
              "containerd-snapshotter": false
            }
          }
        owner: root
        group: root
        mode: "0644"
      notify: Restart docker

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
