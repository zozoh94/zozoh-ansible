---
- hosts: gitlab_runner
  become: yes
  vars:
    sshd_listen: "{{ ansible_all_ipv4_addresses | ansible.netcommon.ipaddr(admin_network) | first }}"
    
    gitlab_runner_runners:
      - name: '{{ ansible_hostname }}'
        state: present
        executor: 'shell'
        output_limit: 4096
        concurrent_specific: '0'
        url: "{{ gitlab_runner_url }}"
        token: "{{ gitlab_runner_token }}"
  
  roles:
    - common
    - riemers.gitlab-runner

  # Docker 29.7+ enables the containerd image store by default. Its push path
  # skips layers the registry reports as "already exists" without linking them
  # to the repository, so the manifest PUT fails with "blob unknown to registry"
  # (moby/moby#53293). The shell executor builds and pushes through this host's
  # Docker, so pin it back to the classic (overlay2) image store.
  tasks:
    - name: Disable Docker containerd image store (classic push path)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "features": {
              "containerd-snapshotter": false
            }
          }
        owner: root
        group: root
        mode: "0644"
      notify: Restart docker

    # Shell-executor jobs build and push through this host's Docker, so every
    # pipeline leaves behind dangling images and build cache that nothing
    # reclaims. Prune nightly to keep the disk bounded. The until=72h filter
    # keeps recent layers so builds stay warm; volumes are left untouched on
    # purpose (no named volume is in play here and they could hold real data).
    - name: Schedule nightly Docker prune
      ansible.builtin.cron:
        name: "gitlab-runner docker prune"
        minute: "0"
        hour: "4"
        job: "docker system prune -af --filter 'until=72h' >/dev/null 2>&1"
        user: root

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
